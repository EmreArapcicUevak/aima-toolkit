[build-system]
requires = [
  "setuptools>=64",
  "wheel",
  "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "aima_toolkit"
authors = [
  { name = "Emre Arapcic-Uevak", email = "emrearapcicuevak@gmail.com" },
]
description = "I made this package to help me on my learning journey through the AIMA book and contains all algorithms I build whilst learning through the book"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = { text = "MIT" }
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/EmreArapcicUevak/aima-toolkit"
Issues = "https://github.com/EmreArapcicUevak/aima-toolkit/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]